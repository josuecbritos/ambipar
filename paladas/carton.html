<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Separación de Cartón — Ambipar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00873D;
    --green-dark: #006830;
    --green-light: #e8f5ee;
    --green-mid: #b8dfc8;
    --white: #ffffff;
    --gray-50: #f4f5f4;
    --gray-100: #eaecea;
    --gray-300: #c8cdc8;
    --gray-500: #7a877a;
    --gray-800: #1e271e;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --orange: #e67e22;
    --orange-light: #fef5ec;
    --shadow: 0 4px 24px rgba(0,87,40,0.13);
    --radius: 16px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: auto; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--gray-50);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    -webkit-overflow-scrolling: touch;
  }

  /* TOP BAR */
  .topbar {
    width: 100%; background: #BDFE00; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .topbar-logo { height: 28px; width: auto; display: block; }
  .topbar-sep { width: 1px; height: 20px; background: rgba(0,0,0,0.25); }
  .topbar-title {
    font-size: 11px; font-weight: 700; color: #1e271e;
    letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.3; flex: 1;
  }
  .topbar-date {
    font-family: 'Roboto Mono', monospace; font-size: 11px;
    font-weight: 500; color: rgba(30,39,30,0.6);
  }

  /* CARD */
  .card {
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); width: calc(100% - 32px); max-width: 420px;
    margin: 10px 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 0;
  }

  /* CAJA HOY (destacada con meta) */
  .total-box {
    flex: 0 0 auto;
    background: var(--green-light); border: 1.5px solid var(--green-mid);
    border-radius: var(--radius); padding: 9px 12px; text-align: center;
    margin-bottom: 8px;
  }
  .total-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--green-dark); margin-bottom: 2px;
  }
  .total-number {
    font-family: 'Roboto Mono', monospace; font-size: 28px; font-weight: 500;
    color: var(--green); line-height: 1.05;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .total-number.bump { transform: scale(1.07); }
  .total-unit { font-size: 13px; color: var(--green-dark); font-weight: 600; }
  .total-sub { font-size: 9px; font-weight: 600; color: var(--gray-500); margin-top: 2px; }
  .total-meta { font-size: 10px; font-weight: 700; color: var(--green-dark); margin-top: 3px; }
  .total-meta .pct { font-family: 'Roboto Mono', monospace; }

  /* CAJAS SEMANA / MES */
  .periodo-row { flex: 0 0 auto; display: flex; gap: 8px; margin-bottom: 10px; }
  .periodo-box {
    flex: 1; background: var(--gray-50); border: 1.5px solid var(--gray-100);
    border-radius: var(--radius-sm); padding: 8px; text-align: center;
  }
  .periodo-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gray-500); margin-bottom: 2px;
  }
  .periodo-number {
    font-family: 'Roboto Mono', monospace; font-size: 17px; font-weight: 500;
    color: var(--gray-800); line-height: 1.1;
  }
  .periodo-number span { font-size: 10px; color: var(--gray-500); font-weight: 600; }
  .periodo-number.on-meta  { color: var(--green); }
  .periodo-number.off-meta { color: var(--red); }
  .periodo-meta {
    font-size: 8px; font-weight: 700; margin-top: 2px; line-height: 1.2;
    letter-spacing: 0.02em;
  }
  .periodo-meta.on-meta  { color: var(--green); }
  .periodo-meta.off-meta { color: var(--red); }

  /* FORM */
  .form-section { flex: 0 0 auto; margin-bottom: 4px; }
  .label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px;
  }

  /* FILA CAMIONES */
  .camiones-row {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 12px; background: #f0f4f8;
    border: 1.5px solid #d8e2ec; border-radius: var(--radius-sm);
  }
  .camiones-info { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .camiones-icon { width: 18px; height: 18px; flex-shrink: 0; }
  .camiones-name { font-size: 13px; font-weight: 700; color: var(--gray-800); }
  .camiones-input {
    width: 74px; flex-shrink: 0; text-align: center;
    background: var(--white); border: 1.5px solid var(--gray-300);
    border-radius: var(--radius-sm); padding: 7px 8px;
    font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700;
    color: var(--gray-800); outline: none; transition: border-color 0.2s;
  }
  .camiones-input:focus { border-color: #4a7ba6; }
  .camiones-input::-webkit-inner-spin-button,
  .camiones-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .camiones-input { -moz-appearance: textfield; }

  /* FILA POR TIPO */
  .tipo-row {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 12px; background: var(--gray-50);
    border: 1.5px solid var(--gray-100); border-radius: var(--radius-sm);
    margin-bottom: 6px;
  }
  .tipo-info { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .tipo-name { font-size: 13px; font-weight: 700; color: var(--gray-800); }
  .tipo-equiv {
    font-size: 9px; font-weight: 600; color: var(--gray-500);
    font-family: 'Roboto Mono', monospace;
  }
  .tipo-input {
    width: 74px; flex-shrink: 0; text-align: center;
    background: var(--white); border: 1.5px solid var(--gray-300);
    border-radius: var(--radius-sm); padding: 7px 8px;
    font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700;
    color: var(--gray-800); outline: none; transition: border-color 0.2s;
  }
  .tipo-input:focus { border-color: var(--green); }
  .tipo-input::placeholder { color: var(--gray-300); font-weight: 400; }
  .tipo-input::-webkit-inner-spin-button,
  .tipo-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .tipo-input { -moz-appearance: textfield; }
  .tipo-kg {
    width: 74px; flex-shrink: 0; text-align: right;
    font-family: 'Roboto Mono', monospace; font-size: 12px;
    font-weight: 500; color: var(--green);
  }
  .tipo-kg.zero { color: var(--gray-300); }

  /* BUTTON */
  .section-button { flex: 0 0 auto; margin: 5px 0; }
  .btn-register {
    background: var(--green-light); border: 2px solid var(--green-mid);
    border-radius: var(--radius); width: 100%; padding: 10px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; user-select: none; outline: none;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
  }
  .btn-register:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-register:not(:disabled):active { transform: scale(0.97); background: var(--green-mid); }
  .btn-register.success { background: var(--green); border-color: var(--green-dark); }
  .btn-icon {
    width: 30px; height: 30px; background: var(--green); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; box-shadow: 0 3px 10px rgba(0,135,61,0.30);
  }
  .btn-register.success .btn-icon { background: rgba(255,255,255,0.2); box-shadow: none; }
  .btn-text {
    font-size: 13px; font-weight: 700; color: var(--green);
    letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s;
  }
  .btn-register.success .btn-text { color: var(--white); }

  /* AVISO YA REGISTRADO */
  .aviso-hoy {
    flex: 0 0 auto;
    display: none; background: var(--orange-light); border: 1.5px solid #f0c89a;
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
    font-size: 11px; font-weight: 600; color: var(--orange); text-align: center;
  }
  .aviso-hoy.active { display: block; }

  /* HISTORY */
  .history-section { display: flex; flex-direction: column; }
  .history-list { display: flex; flex-direction: column; gap: 4px; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--gray-50);
    border-radius: var(--radius-sm); border-left: 3px solid var(--green);
    animation: slideIn 0.2s ease;
  }
  .history-item.hoy { background: var(--green-light); border-left-color: var(--green-dark); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .history-left { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .history-fecha { font-size: 13px; font-weight: 700; color: var(--gray-800); }
  .history-badge {
    display: inline-block; font-size: 8px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--white); background: var(--green); border-radius: 4px;
    padding: 1px 5px; margin-left: 6px; vertical-align: middle;
  }
  .history-fecha-day {
    font-size: 10px; font-weight: 600; color: var(--gray-500);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .history-right { display: flex; align-items: center; gap: 10px; }
  .history-kg {
    font-family: 'Roboto Mono', monospace; font-size: 15px;
    font-weight: 500; color: var(--green); white-space: nowrap;
  }
  .history-kg span { font-size: 10px; color: var(--gray-500); font-weight: 600; }
  .btn-editar {
    background: var(--white); border: 1.5px solid var(--green-mid);
    color: var(--green-dark); border-radius: 6px; padding: 5px 9px;
    font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.03em; cursor: pointer; outline: none; flex-shrink: 0;
    transition: background 0.15s;
  }
  .btn-editar:active { background: var(--green-mid); }
  .pending-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--orange);
    flex-shrink: 0; animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .empty-state {
    text-align: center; color: var(--gray-500); font-size: 11px;
    font-weight: 600; padding: 24px 0; letter-spacing: 0.03em;
  }

  /* SKELETON */
  .skeleton {
    background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-50) 50%, var(--gray-100) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px;
  }
  .skeleton-item { height: 48px; border-radius: var(--radius-sm); margin-bottom: 5px; }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius);
    box-shadow: 0 8px 40px rgba(0,0,0,0.25); padding: 22px 20px;
    width: 100%; max-width: 340px; text-align: center;
    max-height: calc(100dvh - 40px); overflow-y: auto;
  }
  .modal-title { font-size: 15px; font-weight: 800; color: var(--gray-800); margin-bottom: 4px; }
  .modal-sub { font-size: 11px; font-weight: 600; color: var(--gray-500); margin-bottom: 14px; }
  .modal-resumen {
    background: var(--gray-50); border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 6px;
  }
  .modal-line {
    display: flex; align-items: center;
    padding: 4px 0; font-size: 13px; gap: 8px;
  }
  .modal-line + .modal-line { border-top: 1px solid var(--gray-100); }
  .modal-line-tipo { font-weight: 700; color: var(--gray-800); flex: 1; text-align: left; min-width: 0; }
  .modal-line-cant { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--gray-500); width: 52px; text-align: center; flex-shrink: 0; }
  .modal-line-kg { font-family: 'Roboto Mono', monospace; font-weight: 500; color: var(--green); width: 80px; text-align: right; flex-shrink: 0; }
  .modal-total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; margin-bottom: 16px;
    background: var(--green-light); border: 1.5px solid var(--green-mid);
    border-radius: var(--radius-sm);
  }
  .modal-total-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--green-dark);
  }
  .modal-total-kg {
    font-family: 'Roboto Mono', monospace; font-size: 18px;
    font-weight: 500; color: var(--green);
  }
  .modal-buttons { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: var(--radius-sm);
    font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; border: none; outline: none; transition: opacity 0.15s;
  }
  .modal-btn:active { opacity: 0.7; }
  .modal-btn-cancel { background: var(--gray-100); color: var(--gray-500); }
  .modal-btn-confirm { background: var(--green); color: var(--white); }

  /* CAMPOS DEL MODAL DE EDICIÓN */
  .edit-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .edit-row + .edit-row { border-top: 1px solid var(--gray-100); }
  .edit-tipo { flex: 1; text-align: left; font-weight: 700; font-size: 13px; color: var(--gray-800); }
  .edit-input {
    width: 70px; flex-shrink: 0; text-align: center;
    background: var(--white); border: 1.5px solid var(--gray-300);
    border-radius: var(--radius-sm); padding: 7px 6px;
    font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700;
    color: var(--gray-800); outline: none;
  }
  .edit-input:focus { border-color: var(--green); }
  .edit-input::-webkit-inner-spin-button,
  .edit-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .edit-input { -moz-appearance: textfield; }
  .edit-kg {
    width: 78px; flex-shrink: 0; text-align: right;
    font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; color: var(--green);
  }
  .edit-kg.zero { color: var(--gray-300); }

  /* STATUS */
  .status-wrap { flex: 0 0 auto; min-height: 18px; }
  .status-bar {
    text-align: center; font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em; padding: 2px 0; min-height: 16px; color: var(--gray-500);
  }
  .status-bar.ok { color: var(--green); }
  .status-bar.error { color: var(--red); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <img class="topbar-logo" src="https://raw.githubusercontent.com/josuecbritos/ambipar/main/paladas/ambipar-logo.png" alt="Ambipar">
  <div class="topbar-sep"></div>
  <div class="topbar-title">Separación de Cartón<br>Clasificación Giri</div>
  <div class="topbar-date" id="topbarDate"></div>
</div>

<div class="card">

  <!-- HOY (con meta) -->
  <div class="total-box">
    <div class="total-label">Total Cartón Hoy</div>
    <div class="total-number" id="totalKg">0 <span class="total-unit">kg</span></div>
    <div class="total-sub" id="totalSub">Ingrese las cantidades del día</div>
    <div class="total-meta" id="totalMeta"></div>
  </div>

  <!-- SEMANA / MES -->
  <div class="periodo-row">
    <div class="periodo-box">
      <div class="periodo-label">Total Semana</div>
      <div class="periodo-number" id="totalSemana">0 <span>kg</span></div>
      <div class="periodo-meta" id="metaSemana"></div>
    </div>
    <div class="periodo-box">
      <div class="periodo-label">Total Mes</div>
      <div class="periodo-number" id="totalMes">0 <span>kg</span></div>
      <div class="periodo-meta" id="metaMes"></div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-section">
    <div class="label">Camiones recibidos en andén</div>
    <div id="camionesContainer">
      <div class="skeleton skeleton-item"></div>
    </div>

    <div class="label" style="margin-top:10px;">Cantidades del día</div>
    <div id="tiposContainer">
      <div class="skeleton skeleton-item"></div>
      <div class="skeleton skeleton-item"></div>
      <div class="skeleton skeleton-item"></div>
    </div>
  </div>

  <!-- AVISO -->
  <div class="aviso-hoy" id="avisoHoy">⚠ Ya existe un registro para hoy</div>

  <!-- BUTTON -->
  <div class="section-button">
    <button class="btn-register" id="btnRegistrar" onclick="registrar()">
      <div class="btn-icon">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </div>
      <div class="btn-text">Registrar Día</div>
    </button>
  </div>

  <!-- HISTORY -->
  <div class="history-section">
    <div class="label">Últimos días</div>
    <div class="history-list" id="historyList">
      <div class="skeleton skeleton-item"></div>
      <div class="skeleton skeleton-item"></div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="status-wrap"><div class="status-bar" id="statusBar"></div></div>

</div>

<script>
  // ══════════════════════════════════════════════════════════
  //  CONFIGURACIÓN — Reemplaza con la URL de TU Apps Script
  // ══════════════════════════════════════════════════════════
  const API_URL = "https://script.google.com/macros/s/AKfycbycMUnAFBX-wV4L70q9FYm_zF838eN0KZRstZZP5_pTVHg2NC5jQzLagm5fZEP_GUHk/exec";
  const TOKEN   = "carton2026";

  // Cuántos días mostrar en "Últimos días"
  const DIAS_HISTORIAL = 5;

  const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

  // Tipo reservado: conteo de unidades, NO suma kg
  const TIPO_CAMIONES = "Camiones";

  let config = [];        // [{ tipo, kg_unit }]
  let registros = [];     // [{ fecha, tipo, cantidad, kg }]
  let metaDiaria = 0;
  let yaRegistradoHoy = false;
  let modoEdicion = false;
  let guardandoDia = null; // fecha "YYYY-MM-DD" que se está guardando, o null

  window.addEventListener("DOMContentLoaded", () => {
    mostrarFechaHoy();
    cargarDatos();
  });

  function mostrarFechaHoy() {
    const h = new Date();
    document.getElementById("topbarDate").textContent =
      `${String(h.getDate()).padStart(2,"0")}/${String(h.getMonth()+1).padStart(2,"0")}/${h.getFullYear()}`;
  }

  function hoyISO() {
    const h = new Date();
    return h.getFullYear() + "-" + String(h.getMonth()+1).padStart(2,"0") + "-" + String(h.getDate()).padStart(2,"0");
  }

  // ── API ───────────────────────────────────────────
  async function cargarDatos() {
    let data;
    try {
      const res = await fetch(`${API_URL}?token=${TOKEN}`, { redirect: "follow" });
      data = await res.json();
    } catch (err) {
      console.error("Fallo al cargar datos:", err);
      setStatus("Error al cargar datos", "error");
      return;
    }

    config = data.config || [];
    registros = data.registros || [];
    metaDiaria = Number(data.meta_diaria) || 0;

    // Cada paso aislado: si uno falla, los demás igual se ejecutan
    try { renderCamiones(); } catch (e) { console.error("renderCamiones:", e); }
    try { renderTipos(); } catch (e) { console.error("renderTipos:", e); }
    try { verificarHoy(); } catch (e) { console.error("verificarHoy:", e); }
    try { renderPeriodos(); } catch (e) { console.error("renderPeriodos:", e); }
    try { renderHistorial(); } catch (e) { console.error("renderHistorial:", e); }
  }

  function renderCamiones() {
    const cont = document.getElementById("camionesContainer");
    cont.innerHTML = `
      <div class="camiones-row">
        <div class="camiones-info">
          <svg class="camiones-icon" viewBox="0 0 24 24" fill="none" stroke="#7a877a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span class="camiones-name">Camiones recibidos en andén</span>
        </div>
        <input type="number" class="camiones-input" id="camionesInput" placeholder="0"
               inputmode="numeric" min="0" step="1">
      </div>`;
  }

  function renderTipos() {
    const cont = document.getElementById("tiposContainer");
    if (config.length === 0) {
      cont.innerHTML = '<div class="empty-state">No hay tipos configurados</div>';
      return;
    }
    cont.innerHTML = config.map((c, i) => `
      <div class="tipo-row">
        <div class="tipo-info">
          <span class="tipo-name">${c.tipo}</span>
          <span class="tipo-equiv">${formatNum(c.kg_unit)} kg c/u</span>
        </div>
        <input type="number" class="tipo-input" id="tipo_${i}" placeholder="0"
               inputmode="numeric" min="0" step="1" oninput="recalcular()">
        <div class="tipo-kg zero" id="kg_${i}">0 kg</div>
      </div>
    `).join("");
  }

  function recalcular() {
    let total = 0;
    config.forEach((c, i) => {
      const cant = Number(document.getElementById(`tipo_${i}`).value) || 0;
      const kg = cant * Number(c.kg_unit);
      total += kg;
      const cell = document.getElementById(`kg_${i}`);
      cell.textContent = formatNum(kg) + " kg";
      cell.classList.toggle("zero", kg === 0);
    });
    const tn = document.getElementById("totalKg");
    tn.innerHTML = `${formatNum(total)} <span class="total-unit">kg</span>`;
    tn.classList.add("bump");
    setTimeout(() => tn.classList.remove("bump"), 180);
    renderMeta(total);
  }

  function renderMeta(totalHoy) {
    const el = document.getElementById("totalMeta");
    if (!metaDiaria || metaDiaria <= 0) { el.textContent = ""; return; }
    const pct = Math.round((totalHoy / metaDiaria) * 100);
    el.innerHTML = `Meta diaria: ${formatNum(metaDiaria)} kg · <span class="pct">${pct}%</span>`;
  }

  // Total del día actual ya registrado (suma de kg de hoy en la base)
  function totalHoyRegistrado() {
    const hoy = hoyISO();
    return registros
      .filter(r => normalizarFecha(r.fecha) === hoy && r.tipo !== TIPO_CAMIONES)
      .reduce((s, r) => s + Number(r.kg || 0), 0);
  }

  // ── PERIODOS (semana L–V y mes) con meta proporcional ──
  function esLaboral(d) { const g = d.getDay(); return g >= 1 && g <= 5; } // lun-vie
  function diasLaboralesMes(y, m) {
    let c = 0, last = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= last; d++) if (esLaboral(new Date(y, m, d))) c++;
    return c;
  }
  function pc(v, meta) { return meta > 0 ? Math.round(v / meta * 100) : 0; }

  function renderPeriodos() {
    const hoy = new Date();
    const year = hoy.getFullYear();
    const mes = hoy.getMonth();

    // Lunes de la semana actual
    const lunes = new Date(hoy);
    const dow = (hoy.getDay() + 6) % 7; // 0 = lunes
    lunes.setDate(hoy.getDate() - dow);
    lunes.setHours(0, 0, 0, 0);

    // Sumar kg por periodo (excluye Camiones, que no es kg)
    let kgSemana = 0, kgMes = 0;
    registros.forEach(r => {
      if (r.tipo === TIPO_CAMIONES) return;
      const f = normalizarFecha(r.fecha);
      if (!f) return;
      const d = new Date(f + "T12:00:00");
      const diaSemana = (d.getDay() + 6) % 7;
      const finSemana = new Date(lunes); finSemana.setDate(lunes.getDate() + 4); finSemana.setHours(23,59,59,999);
      if (d >= lunes && d <= finSemana && diaSemana <= 4) kgSemana += Number(r.kg || 0);
      if (d.getFullYear() === year && d.getMonth() === mes) kgMes += Number(r.kg || 0);
    });

    // Días hábiles transcurridos (incluye hoy si es laboral)
    let diasSem = 0;
    for (let i = 0; i < 5; i++) {
      const d = new Date(lunes); d.setDate(lunes.getDate() + i);
      if (d > hoy) break;
      diasSem++;
    }
    let diasMes = 0;
    for (let d = 1; d <= hoy.getDate(); d++) {
      if (esLaboral(new Date(year, mes, d))) diasMes++;
    }
    const dlm = diasLaboralesMes(year, mes);

    const metaSem = diasSem * metaDiaria;
    const metaMes = diasMes * metaDiaria;

    pintarPeriodo("Semana", kgSemana, metaSem, diasSem, 5);
    pintarPeriodo("Mes", kgMes, metaMes, diasMes, dlm);
  }

  function pintarPeriodo(periodo, kg, meta, diasTrans, diasTot) {
    const numEl = document.getElementById("total" + periodo);
    const metaEl = document.getElementById("meta" + periodo);
    numEl.innerHTML = `${formatNum(kg)} <span>kg</span>`;

    if (!metaDiaria || metaDiaria <= 0) {
      if (metaEl) { metaEl.textContent = ""; metaEl.className = "periodo-meta"; }
      numEl.classList.remove("on-meta", "off-meta");
      return;
    }
    const pct = pc(kg, meta);
    const cumple = kg >= meta;
    if (metaEl) {
      metaEl.textContent = `${pct}% · ${formatNum(kg)}/${formatNum(meta)} · ${diasTrans}/${diasTot} días`;
      metaEl.className = "periodo-meta " + (cumple ? "on-meta" : "off-meta");
    }
    numEl.classList.remove("on-meta", "off-meta");
    numEl.classList.add(cumple ? "on-meta" : "off-meta");
  }

  function verificarHoy() {
    const hoy = hoyISO();
    yaRegistradoHoy = registros.some(r => normalizarFecha(r.fecha) === hoy);
    const aviso = document.getElementById("avisoHoy");
    const btn = document.getElementById("btnRegistrar");
    const btnText = document.querySelector("#btnRegistrar .btn-text");
    aviso.classList.remove("active");

    if (yaRegistradoHoy) {
      modoEdicion = false;
      // Precargar las cantidades registradas hoy (solo lectura)
      const filasHoy = registros.filter(r => normalizarFecha(r.fecha) === hoy);
      config.forEach((c, i) => {
        const reg = filasHoy.find(r => r.tipo === c.tipo);
        const inp = document.getElementById(`tipo_${i}`);
        if (inp) { inp.value = reg ? reg.cantidad : ""; inp.disabled = true; }
      });
      const cam = filasHoy.find(r => r.tipo === TIPO_CAMIONES);
      const camInp = document.getElementById("camionesInput");
      if (camInp) { camInp.value = cam ? cam.cantidad : 0; camInp.disabled = true; }
      btnText.textContent = "Día ya registrado";
      btn.disabled = true;
    } else {
      modoEdicion = false;
      config.forEach((c, i) => {
        const inp = document.getElementById(`tipo_${i}`);
        if (inp) inp.disabled = false;
      });
      const camInp = document.getElementById("camionesInput");
      if (camInp) camInp.disabled = false;
      btnText.textContent = "Registrar Día";
      btn.disabled = false;
    }
    recalcular();
  }

  // Acepta fecha ISO "YYYY-MM-DD" o cadena de fecha completa y devuelve "YYYY-MM-DD"
  function normalizarFecha(f) {
    if (!f) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
    const d = new Date(f);
    if (isNaN(d)) return String(f).slice(0,10);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  // ── REGISTRAR (abre confirmación) ──────────────────
  let filasPendientes = [];

  function registrar() {
    const filas = [];
    // Camiones: ancla del día, SIEMPRE se incluye (aunque sea 0)
    const camiones = Number(document.getElementById("camionesInput").value) || 0;
    filas.push({ tipo: TIPO_CAMIONES, cantidad: camiones, kg: 0 });

    // Tipos de cartón: solo si cantidad > 0
    config.forEach((c, i) => {
      const cant = Number(document.getElementById(`tipo_${i}`).value) || 0;
      if (cant > 0) {
        filas.push({ tipo: c.tipo, cantidad: cant, kg: cant * Number(c.kg_unit) });
      }
    });

    filasPendientes = filas;
    abrirModal(filas);
  }

  function abrirModal(filas) {
    const h = new Date();
    document.getElementById("modalFecha").textContent =
      `${String(h.getDate()).padStart(2,"0")}/${String(h.getMonth()+1).padStart(2,"0")}/${h.getFullYear()}`;

    document.querySelector(".modal-title").textContent = "Confirmar registro";
    document.querySelector(".modal-btn-confirm").textContent = "Registrar";

    let total = 0;
    document.getElementById("modalResumen").innerHTML = filas.map(f => {
      if (f.tipo === TIPO_CAMIONES) {
        return `
        <div class="modal-line">
          <span class="modal-line-tipo">Camiones</span>
          <span class="modal-line-cant">×${formatNum(f.cantidad)}</span>
          <span class="modal-line-kg">—</span>
        </div>`;
      }
      total += f.kg;
      return `
      <div class="modal-line">
        <span class="modal-line-tipo">${f.tipo}</span>
        <span class="modal-line-cant">×${formatNum(f.cantidad)}</span>
        <span class="modal-line-kg">${formatNum(f.kg)} kg</span>
      </div>`;
    }).join("");

    document.getElementById("modalTotalKg").textContent = formatNum(total) + " kg";
    document.getElementById("modalOverlay").classList.add("active");
  }

  function cerrarModal() {
    document.getElementById("modalOverlay").classList.remove("active");
  }

  // ── CONFIRMAR (guarda el día de hoy desde el formulario) ──
  async function confirmarRegistro() {
    cerrarModal();
    if (filasPendientes.length === 0) return;

    const fecha = hoyISO();
    // Adjuntar id + timestamp UTC a cada fila (estándar de las otras herramientas)
    const ts = new Date().toISOString();
    const filas = filasPendientes.map(f => ({
      id: crypto.randomUUID(),
      tipo: f.tipo,
      cantidad: f.cantidad,
      kg: f.kg,
      timestamp: ts
    }));

    // 1) UI inmediata
    aplicarFilasLocal(fecha, filas);
    yaRegistradoHoy = true;
    modoEdicion = false;
    document.getElementById("avisoHoy").classList.remove("active");
    animarBoton();
    guardandoDia = fecha;
    verificarHoy();      // bloquea inputs y botón
    renderHistorial();
    renderPeriodos();
    setStatus("Guardando…", "");

    // 2) Backend en segundo plano
    await enviarDia(fecha, filas);
  }

  // Reemplaza en memoria las filas de una fecha
  function aplicarFilasLocal(fecha, filas) {
    registros = registros.filter(r => normalizarFecha(r.fecha) !== fecha);
    filas.forEach(f => registros.push({
      id: f.id, fecha: fecha, tipo: f.tipo,
      cantidad: f.cantidad, kg: f.kg, timestamp: f.timestamp
    }));
  }

  // POST en segundo plano (no bloquea). guardandoDia marca el ítem en proceso.
  async function enviarDia(fecha, filas) {
    const payload = { fecha: fecha, filas: filas };
    try {
      const res = await fetch(`${API_URL}?token=${TOKEN}`, {
        method: "POST", redirect: "follow",
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      guardandoDia = null;
      renderHistorial();
      setStatus(data && data.reemplazado ? "✓ Día actualizado" : "✓ Día registrado", "ok");
    } catch (err) {
      guardandoDia = null;
      renderHistorial();
      setStatus("⚠ Error al guardar — reintenta", "error");
    }
  }

  function animarBoton() {
    const btn = document.getElementById("btnRegistrar");
    btn.classList.add("success");
    setTimeout(() => btn.classList.remove("success"), 700);
  }

  // ── HISTORIAL: últimos N días hábiles (incluye los que están en 0) ──
  function fechaToISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function esHabil(d) { const g = d.getDay(); return g >= 1 && g <= 5; } // lun-vie
  // Día hábil anterior a hoy (salta sáb/dom)
  function diaHabilAnteriorISO() {
    const a = new Date();
    do { a.setDate(a.getDate() - 1); } while (!esHabil(a));
    return fechaToISO(a);
  }
  // Últimos N días hábiles terminando hoy (si hoy es hábil) o en el último hábil
  function ultimosDiasHabiles(n) {
    const out = [];
    const d = new Date();
    while (out.length < n) {
      if (esHabil(d)) out.push(fechaToISO(d));
      d.setDate(d.getDate() - 1);
    }
    return out; // del más reciente al más antiguo
  }

  function renderHistorial() {
    const lista = document.getElementById("historyList");

    const kgPorFecha = {};        // suma de kg (excluye Camiones)
    const camionesPorFecha = {};  // # camiones por fecha
    const registrado = {};        // fechas que tienen alguna fila (día registrado)
    registros.forEach(r => {
      const f = normalizarFecha(r.fecha);
      if (!f) return;
      registrado[f] = true;
      if (r.tipo === TIPO_CAMIONES) {
        camionesPorFecha[f] = (camionesPorFecha[f] || 0) + Number(r.cantidad || 0);
      } else {
        kgPorFecha[f] = (kgPorFecha[f] || 0) + Number(r.kg || 0);
      }
    });

    const hoy = hoyISO();
    const habilAnterior = diaHabilAnteriorISO();
    const fechas = ultimosDiasHabiles(DIAS_HISTORIAL + 1)
      // Hoy solo aparece si fue registrado; el resto siempre (en 0 si no hay)
      .filter(f => f !== hoy || registrado[hoy])
      .slice(0, DIAS_HISTORIAL);

    lista.innerHTML = fechas.map(f => {
      const kg = kgPorFecha[f] || 0;
      const cam = camionesPorFecha[f] || 0;
      const d = new Date(f + "T00:00:00");
      const fechaDisp = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
      const esHoy = (f === hoy);
      const editable = (f === hoy || f === habilAnterior);
      const badge = esHoy ? '<span class="history-badge">HOY</span>' : '';
      const dot = (guardandoDia === f) ? '<span class="pending-dot" title="Guardando…"></span>' : '';
      const editBtn = editable ? `<button class="btn-editar" onclick="abrirModalEdit('${f}')">Editar</button>` : '';
      return `
      <div class="history-item${esHoy ? ' hoy' : ''}">
        <div class="history-left">
          <div class="history-fecha">${fechaDisp}${badge}</div>
          <div class="history-fecha-day">${DIAS[d.getDay()]} · ${cam} ${cam === 1 ? "camión" : "camiones"}</div>
        </div>
        <div class="history-right">
          ${dot}
          <div class="history-kg">${formatNum(kg)} <span>kg</span></div>
          ${editBtn}
        </div>
      </div>`;
    }).join("");
  }

  // ── MODAL DE EDICIÓN (hoy / ayer) ──────────────────
  let fechaEditando = null;

  function abrirModalEdit(fecha) {
    fechaEditando = fecha;
    const d = new Date(fecha + "T00:00:00");
    const disp = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} · ${DIAS[d.getDay()]}`;
    document.getElementById("modalEditFecha").textContent = disp;

    const filasDia = registros.filter(r => normalizarFecha(r.fecha) === fecha);
    const camReg = filasDia.find(r => r.tipo === TIPO_CAMIONES);
    const camVal = camReg ? camReg.cantidad : 0;

    const camposHtml = `
      <div class="edit-row">
        <span class="edit-tipo">Camiones</span>
        <input type="number" class="edit-input" id="editCamiones" value="${camVal}" placeholder="0"
               inputmode="numeric" min="0" step="1">
        <span class="edit-kg" style="color:var(--gray-300)">—</span>
      </div>` +
      config.map((c, i) => {
        const reg = filasDia.find(r => r.tipo === c.tipo);
        const val = reg ? reg.cantidad : "";
        return `
        <div class="edit-row">
          <span class="edit-tipo">${c.tipo}</span>
          <input type="number" class="edit-input" id="edit_${i}" value="${val}" placeholder="0"
                 inputmode="numeric" min="0" step="1" oninput="recalcularEdit()">
          <span class="edit-kg zero" id="editkg_${i}">0 kg</span>
        </div>`;
      }).join("");

    document.getElementById("modalEditCampos").innerHTML = camposHtml;
    recalcularEdit();
    document.getElementById("modalEditOverlay").classList.add("active");
  }

  function recalcularEdit() {
    let total = 0;
    config.forEach((c, i) => {
      const cant = Number(document.getElementById(`edit_${i}`).value) || 0;
      const kg = cant * Number(c.kg_unit);
      total += kg;
      const cell = document.getElementById(`editkg_${i}`);
      cell.textContent = formatNum(kg) + " kg";
      cell.classList.toggle("zero", kg === 0);
    });
    document.getElementById("modalEditTotal").textContent = formatNum(total) + " kg";
  }

  function cerrarModalEdit() {
    document.getElementById("modalEditOverlay").classList.remove("active");
    fechaEditando = null;
  }

  async function guardarEdicion() {
    if (!fechaEditando) return;
    const fecha = fechaEditando;

    const ts = new Date().toISOString();
    const filas = [];
    // Camiones: ancla, siempre se guarda (aunque sea 0)
    const camiones = Number(document.getElementById("editCamiones").value) || 0;
    filas.push({ id: crypto.randomUUID(), tipo: TIPO_CAMIONES, cantidad: camiones, kg: 0, timestamp: ts });

    config.forEach((c, i) => {
      const cant = Number(document.getElementById(`edit_${i}`).value) || 0;
      if (cant > 0) {
        filas.push({
          id: crypto.randomUUID(),
          tipo: c.tipo,
          cantidad: cant,
          kg: cant * Number(c.kg_unit),
          timestamp: ts
        });
      }
    });

    cerrarModalEdit();

    // UI inmediata
    aplicarFilasLocal(fecha, filas);
    guardandoDia = fecha;
    renderHistorial();
    renderPeriodos();
    // Si editamos hoy, refrescar también el formulario y la caja de hoy
    if (fecha === hoyISO()) {
      verificarHoy();
    }
    setStatus("Guardando…", "");

    await enviarDia(fecha, filas);
  }

  function formatNum(n) { return Number(n).toLocaleString("es-CL"); }

  function setStatus(msg, tipo) {
    const bar = document.getElementById("statusBar");
    bar.textContent = msg;
    bar.className = "status-bar" + (tipo ? ` ${tipo}` : "");
    if (tipo === "ok") setTimeout(() => { if (bar.textContent === msg) setStatus("", ""); }, 2500);
  }
</script>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title">Confirmar registro</div>
    <div class="modal-sub" id="modalFecha"></div>
    <div class="modal-resumen" id="modalResumen"></div>
    <div class="modal-total">
      <span class="modal-total-label">Total</span>
      <span class="modal-total-kg" id="modalTotalKg">0 kg</span>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" onclick="confirmarRegistro()">Registrar</button>
    </div>
  </div>
</div>

<!-- MODAL EDICIÓN (hoy / ayer) -->
<div class="modal-overlay" id="modalEditOverlay">
  <div class="modal-box">
    <div class="modal-title">Editar día</div>
    <div class="modal-sub" id="modalEditFecha"></div>
    <div id="modalEditCampos"></div>
    <div class="modal-total">
      <span class="modal-total-label">Total</span>
      <span class="modal-total-kg" id="modalEditTotal">0 kg</span>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" onclick="cerrarModalEdit()">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

</body>
</html>
